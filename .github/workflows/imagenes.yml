# AR.T.L.A.S. OS Tiny · construye la ISO liviana (amd64, ~650–800 MB) para máquinas virtuales y equipos con poca memoria.
# La fuente se sube como .zip al repositorio (por ejemplo ARTLAS-OS-Tiny-v80-fuente.zip): se descomprime sola y,
# si hay varios, se usa el de versión más alta según su artlas.config.json.
# Se lanza a mano: Actions → «Imágenes AR.T.L.A.S. OS Tiny» → Run workflow. Duración: ~10 minutos.
name: Imágenes AR.T.L.A.S. OS Tiny
on:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir la fuente si se subió como .zip
        run: |
          # elige el .zip de la versión más alta según SU artlas.config.json (no por el nombre: v761 > v77 al ordenar texto)
          Z=$(python3 - <<'PY'
          import glob, json, re, zipfile
          best = None
          for f in glob.glob("ARTLAS-OS-*fuente*.zip"):
              try: v = json.loads(zipfile.ZipFile(f).read("artlas.config.json"))["ver"]
              except Exception: continue
              k = tuple(int(x) for x in re.findall(r"\d+", v))
              if best is None or k > best[0]: best = (k, f)
          print(best[1] if best else "")
          PY
          )
          if [ -n "$Z" ]; then unzip -o -q "$Z" && echo "Fuente tomada de $Z"; fi
          test -f build.mjs || { echo "::error::Falta la fuente: subí ARTLAS-OS-vXX-fuente.zip al repositorio"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: artlas-dist
          path: |
            dist/web-only
            dist/nucleo
            dist/rag
          retention-days: 3

  iso-tiny:
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir la fuente si se subió como .zip
        run: |
          # elige el .zip de la versión más alta según SU artlas.config.json (no por el nombre: v761 > v77 al ordenar texto)
          Z=$(python3 - <<'PY'
          import glob, json, re, zipfile
          best = None
          for f in glob.glob("ARTLAS-OS-*fuente*.zip"):
              try: v = json.loads(zipfile.ZipFile(f).read("artlas.config.json"))["ver"]
              except Exception: continue
              k = tuple(int(x) for x in re.findall(r"\d+", v))
              if best is None or k > best[0]: best = (k, f)
          print(best[1] if best else "")
          PY
          )
          if [ -n "$Z" ]; then unzip -o -q "$Z" && echo "Fuente tomada de $Z"; fi
          test -f build.mjs || { echo "::error::Falta la fuente: subí ARTLAS-OS-vXX-fuente.zip al repositorio"; exit 1; }
      - name: Liberar espacio en el disco del runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/download-artifact@v4
        with: { name: artlas-dist, path: dist }
      - name: Construir la ISO Tiny (live-build en un contenedor Debian 13)
        run: sudo ARTLAS_PERFIL=tiny ARTLAS_SALIDA=$PWD/imagen/salida bash imagen/iso/construir.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ARTLAS-OS-Tiny-iso-amd64
          path: imagen/salida/ARTLAS-OS-Tiny-*
          compression-level: 0
          if-no-files-found: error

